<!doctype html>
<html lang="ko">
<head>

  <link rel="stylesheet" href="./menu.css">

  <header class="hero">

      <div class="top"><span>NOODLE KITCHEN</span>

            <option value="en" lang="en">English</option>
            <option value="ja" lang="ja">日本語</option>
            <option value="zh-CN" lang="zh-CN">简体中文</option>

      <h1 id="title">메뉴</h1>
      <p id="intro">따뜻한 한 그릇과 곁들임</p>
    </div>
  </header>
  <main class="wrap">
    <nav id="filters" aria-label="카테고리"></nav>
    <p id="status" role="status"></p>
    <div id="menu" class="grid"></div>
    <noscript>JavaScript를 켜면 메뉴를 볼 수 있습니다. Enable JavaScript to view the menu.</noscript>
