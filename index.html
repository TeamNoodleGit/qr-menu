<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>서비의 전통 맛 젓갈 · 메뉴</title>
  <link rel="stylesheet" href="./menu.css?v=20261110-card-spacing">
  <script type="module" src="./menu.js?v=20261110-card-us"></script>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <div class="top"><div class="brand"><img class="brand-logo" src="./images/store-logo.jpg" alt="" width="371" height="90"><span id="brand">서비의 전통 맛 젓갈</span></div>

      </div>
      <h1 id="title">메뉴</h1>
    </div>
  </header>
  <main class="wrap">
    <nav id="filters" aria-label="카테고리"></nav>
    <p id="status" role="status"></p>
    <div id="menu" class="grid"></div>
    <a class="back-link" id="back-link" href="#menu" hidden>메뉴로 돌아가기</a>
    <section id="store" class="store" hidden></section>
    <noscript>JavaScript를 켜면 메뉴를 볼 수 있습니다. Enable JavaScript to view the menu.</noscript>
  </main>
  <aside class="floating-tools">
    <details id="language-picker" class="language-picker">
      <summary id="language-toggle" aria-label="언어"><img id="current-language" src="./flags/ko.svg" alt="" width="27" height="18"><span aria-hidden="true">⌃</span></summary>
        <div class="languages" id="language" role="group" aria-label="언어">
          <button type="button" data-locale="ko" lang="ko" aria-label="한국어" title="한국어" aria-pressed="true"><img src="./flags/ko.svg" alt="" width="27" height="18"></button>
          <button type="button" data-locale="en" lang="en" aria-label="English" title="English" aria-pressed="false"><img src="./flags/en.svg?v=us" alt="" width="27" height="18"></button>
          <button type="button" data-locale="ja" lang="ja" aria-label="日本語" title="日本語" aria-pressed="false"><img src="./flags/ja.svg" alt="" width="27" height="18"></button>
          <button type="button" data-locale="zh-CN" lang="zh-CN" aria-label="简体中文" title="简体中文" aria-pressed="false"><img src="./flags/zh-CN.svg" alt="" width="27" height="18"></button>
        </div>
    </details>
    <a class="store-link" id="store-link" href="#store">가게 정보</a>
  </aside>
  <dialog id="product-dialog" aria-labelledby="product-title">
    <form method="dialog"><button id="close-dialog" class="close-dialog" aria-label="닫기">×</button></form>
    <div id="product-detail"></div>
  </dialog>
</body>
</html>
